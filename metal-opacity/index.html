<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metal Opacity - 金属薄膜光学特性计算器</title>
  <link rel="stylesheet" href="style.css">
  <!-- Plotly.js CDN -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Metal Opacity</h1>
      <p class="subtitle">基于传输矩阵法 (TMM) | 波长 400–1400 nm | 厚度 1–200 nm</p>
    </header>

    <div class="controls">
      <!-- 模式切换 -->
      <div class="control-group mode-toggle">
        <label>扫描模式：</label>
        <div class="toggle-group">
          <label class="toggle-option active" data-mode="spectral">
            <input type="radio" name="mode" value="spectral" checked> 光谱扫描
          </label>
          <label class="toggle-option" data-mode="thickness">
            <input type="radio" name="mode" value="thickness"> 厚度扫描
          </label>
        </div>
      </div>

      <div class="control-group">
        <label for="metal-select">金属材料：</label>
        <select id="metal-select">
          <option value="Ag">银 (Ag)</option>
          <option value="Au">金 (Au)</option>
          <option value="Cu">铜 (Cu)</option>
          <option value="W">钨 (W)</option>
        </select>
      </div>

      <!-- 光谱模式：固定厚度滑块 -->
      <div class="control-group" id="thickness-control">
        <label for="thickness-slider">
          薄膜厚度：<span id="thickness-value">30</span> nm
        </label>
        <input type="range" id="thickness-slider" min="1" max="200" value="30" step="1">
      </div>

      <!-- 厚度扫描模式：固定波长滑块 -->
      <div class="control-group" id="wavelength-control" style="display:none;">
        <label for="wavelength-slider">
          固定波长：<span id="wavelength-value">600</span> nm
        </label>
        <input type="range" id="wavelength-slider" min="400" max="1400" value="600" step="1">
      </div>

      <div class="control-group">
        <label for="display-select">显示模式：</label>
        <select id="display-select">
          <option value="T">透光率 (T)</option>
          <option value="R">反射率 (R)</option>
          <option value="A">吸收率 (A)</option>
          <option value="all">全部 (T / R / A)</option>
        </select>
      </div>

      <div class="control-group">
        <label for="substrate-select">基底折射率：</label>
        <select id="substrate-select">
          <option value="1.0">空气 (n=1.0)</option>
          <option value="1.5" selected>玻璃 (n=1.5)</option>
          <option value="2.0">蓝宝石 (n=2.0)</option>
        </select>
      </div>
    </div>

    <div class="chart-container">
      <div id="chart"></div>
    </div>

    <div class="info-panel">
      <div class="info-card">
        <span class="info-label">金属</span>
        <span id="info-metal" class="info-value">银 (Ag)</span>
      </div>
      <div class="info-card" id="info-thickness-card">
        <span class="info-label">厚度</span>
        <span id="info-thickness" class="info-value">30 nm</span>
      </div>
      <div class="info-card" id="info-wavelength-card" style="display:none;">
        <span class="info-label">固定波长</span>
        <span id="info-fixed-wavelength" class="info-value">600 nm</span>
      </div>
      <div class="info-card">
        <span class="info-label">峰值透光率</span>
        <span id="info-Tmax" class="info-value">—</span>
      </div>
      <div class="info-card">
        <span class="info-label">谷值透光率</span>
        <span id="info-Tmin" class="info-value">—</span>
      </div>
      <div class="info-card">
        <span class="info-label">平均透光率</span>
        <span id="info-Tavg" class="info-value">—</span>
      </div>
    </div>

    <div class="footer-note">
      <p>数据参考：Johnson &amp; Christy (1972), Palik (1985) | 计算模型：传输矩阵法 (Transfer Matrix Method)</p>
    </div>
  </div>

  <!-- 引入脚本 -->
  <script src="metals.js"></script>
  <script src="physics.js"></script>
  <script src="app.js"></script>
</body>
</html>

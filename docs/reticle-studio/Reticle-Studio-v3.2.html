<body><div class="app">
<header class="toolbar"><div class="brand">RETICLE STUDIO <small>v3.2</small></div>
<div class="export-group"><button class="btn primary" id="btnCopy">复制透明 PNG</button><button class="btn" id="btnPNG">下载 PNG</button><button class="btn" id="btnPDF">保存 PDF</button></div><span class="btn-divider"></span>
<button class="btn subtle" id="btnImport">导入 JSON</button><button class="btn subtle" id="btnExport">导出 JSON</button><button class="btn" id="btnInfo" aria-expanded="false" aria-controls="panelRight">参数摘要</button></header>
<main class="workspace"><aside class="panel" id="panelLeft" aria-label="输入与显示设置"></aside>
<section class="canvas-area" aria-label="Reticle 示意图"><div class="canvas-head"><div><h2 id="canvasTitle">Reticle / Shot 示意图</h2><p>Step / Shot 随参数实时推导</p></div><span class="status" id="scaleStatus">街道增强显示</span></div>
<div class="canvas-wrap" id="canvasWrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Reticle、Die 阵列及街道尺寸示意图"></svg><span class="zoom" id="zoomInd">100%</span><div class="controls"><button id="btnZoomOut" title="缩小" aria-label="缩小">−</button><button id="btnZoomIn" title="放大" aria-label="放大">＋</button><button id="btnFit" class="fit" title="适应完整图形" aria-label="适应完整图形">⤢</button><button id="btnReset" class="fit" title="重置视图" aria-label="重置视图">↺</button></div></div>
<footer class="canvas-footer"><div class="legend"><span id="shotLegend"><i></i>Shot 边界</span><span><i class="step"></i>Step 边界 · 可拖动</span></div><span class="gesture">滚轮缩放 · 拖动平移</span><span class="export-note">PNG · 透明背景 · 3× 分辨率</span></footer></section>
<aside class="info" id="panelRight" hidden aria-label="参数摘要"></aside></main></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div><input type="file" id="fileInput" accept=".json,application/json" hidden>
<script>
'use strict';
// All geometry is at wafer scale, in micrometres. Overlap is total neighbouring-shot overlap.
const MAX_COUNT=30, MAX_LANES=32, EPS=1e-7;
const clone=o=>JSON.parse(JSON.stringify(o));
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const fmt=n=>Number.isFinite(Number(n))?Number(n).toFixed(4).replace(/\.?0+$/,'')||'0':'—';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lane=(name,width,color)=>({name,width,color});
function templateStreet(s,axis,index){
 const count=axis==='x'?s.cols:s.rows;
 const laneCount=index===0||index===count?1:2;
 const width=targetWidth(s,axis,index),margin=width/10,track=(width-2*margin)/laneCount;
 return {name:axis.toUpperCase()+'街'+(index+1),lanes:[
  lane('窄道 A',margin,'#7b2cbf'),
  ...Array.from({length:laneCount},(_,i)=>lane('车道 '+(i+1),track,i===0?'#cfe3ff':'#f3d46e')),
  lane('窄道 B',margin,'#7b2cbf')
 ]};
}
function createDefault(){
 const s={version:3,meta:{title:'Reticle / Shot Demo',unit:'µm',plane:'wafer'},
  die:{x:4000,y:2500},scribe:{x:100,y:80},overlap:{x:20,y:40},
  stepOffset:{x:0,y:0},cols:3,rows:2,vStreets:[],hStreets:[],
  render:{alpha:.5,laneOpacity:.65,showDims:true,showStep:true}};
 syncStreets(s);
 return s;
}
function targetWidth(s,axis,i){const n=axis==='x'?s.cols:s.rows;return i===0||i===n?(s.scribe[axis]+s.overlap[axis])/2:s.scribe[axis];}
function streetWidth(st){return st.lanes.reduce((a,l)=>a+l.width,0);}
function syncStreets(s){
 for(const [axis,key,n] of [['x','vStreets',s.cols],['y','hStreets',s.rows]]){
  // Preserve the two edge patterns when growing or shrinking an array.
  const old=s[key]||[],left=old[0],right=old.length>1?old[old.length-1]:null,inside=old.slice(1,-1);
  s[key]=Array.from({length:n+1},(_,i)=>i===0&&left?left:i===n&&right?right:i>0&&i<n&&inside[i-1]?inside[i-1]:templateStreet(s,axis,i));
 }
}
function computeDerived(s){const dcx=s.die.x+s.scribe.x,dcy=s.die.y+s.scribe.y,stepX=s.cols*dcx,stepY=s.rows*dcy,shotX=stepX+s.overlap.x,shotY=stepY+s.overlap.y;return{dcx,dcy,stepX,stepY,shotX,shotY,util:100*s.cols*s.rows*s.die.x*s.die.y/(shotX*shotY),edgeX:(s.scribe.x+s.overlap.x)/2,edgeY:(s.scribe.y+s.overlap.y)/2};}
function streetChecks(s){return [['x','vStreets'],['y','hStreets']].flatMap(([axis,key])=>s[key].map((st,i)=>{const actual=streetWidth(st),target=targetWidth(s,axis,i),delta=actual-target;return{axis,key,i,actual,target,delta,mismatch:Math.abs(delta)>1e-5};}));}
function layoutMetrics(s){return{x:s.cols*s.die.x+s.vStreets.reduce((sum,st)=>sum+streetWidth(st),0),y:s.rows*s.die.y+s.hStreets.reduce((sum,st)=>sum+streetWidth(st),0)};}
function streetStatus(s,key,i){const check=streetChecks(s).find(c=>c.key===key&&c.i===i),delta=(check.delta>0?'+':'')+Number(check.delta.toFixed(8));return `<span>实际 ${fmt(check.actual)} · 目标 ${fmt(check.target)} µm</span>${check.mismatch?`<strong role="status">⚠ 差值 ${delta} µm · 数值已保留</strong>`:''}`;}
function updateStreetStatus(el,key,i){const mismatch=streetChecks(state).find(c=>c.key===key&&c.i===i).mismatch;el.classList.toggle('has-warning',mismatch);el.querySelector('.st-total').textContent='Σ '+fmt(streetWidth(state[key][i]));el.querySelector('.street-status').innerHTML=streetStatus(state,key,i);}
function numeric(v,label,min=0,max=1e8){if(typeof v!=='number'||!Number.isFinite(v)||v<min||v>max)throw Error(label+' 必须为 '+min+'–'+max+' 范围内的有限数值');return v;}
function normalizeConfig(o){
 if(!o||typeof o!=='object'||Array.isArray(o))throw Error('配置必须为 JSON 对象');
 if(o.version!=null&&o.version!==3&&o.version!==2&&o.version!=='2.1')throw Error('不支持此配置版本');
 const s={version:3,meta:{title:String(o.meta?.title??'Reticle / Shot 示意图').slice(0,120),unit:'µm',plane:'wafer'},die:{},scribe:{},overlap:{},cols:0,rows:0,vStreets:[],hStreets:[],render:{}};
 if(o.meta?.unit&&!['µm','μm','um'].includes(o.meta.unit))throw Error('当前只接受 µm 单位；请先换算配置中的全部长度');
 if(o.meta?.plane&&o.meta.plane!=='wafer')throw Error('请先将尺寸换算为 wafer 面');
 for(const k of ['cols','rows']){s[k]=numeric(o[k],k,1,MAX_COUNT);if(!Number.isInteger(s[k]))throw Error('阵列行列数必须为整数');}
 for(const a of ['x','y']){s.die[a]=numeric(o.die?.[a],'Die '+a,.0001);s.overlap[a]=numeric(o.overlap?.[a]??0,'Overlap '+a);}
 const legacy=!o.scribe;
 for(const [a,key,n] of [['x','vStreets',s.cols],['y','hStreets',s.rows]]){
  const arr=o[key];if(!Array.isArray(arr)||arr.length!==n+1)throw Error(key+' 必须包含 '+(n+1)+' 条街道');
  s[key]=arr.map(st=>{if(!st||!Array.isArray(st.lanes)||!st.lanes.length||st.lanes.length>MAX_LANES)throw Error('每街需有 1–'+MAX_LANES+' 条车道');return{name:String(st.name??'街道').slice(0,80),lanes:st.lanes.map(l=>{if(!l||!/^#[\da-f]{6}$/i.test(l.color))throw Error('车道颜色需为 #RRGGBB');return lane(String(l.name??'车道').slice(0,80),numeric(l.width,'车道宽度'),l.color);})};});
  if(legacy){
   const inner=s[key].slice(1,-1).map(streetWidth);
   const inferred=inner.length?inner[0]:typeof o.step?.[a]==='number'?o.step[a]/n-s.die[a]:streetWidth(s[key][0])+streetWidth(s[key][n])-s.overlap[a];
   s.scribe[a]=numeric(inferred,'推导 Scribe '+a);
  }else{s.scribe[a]=numeric(o.scribe[a],'Scribe '+a);}
 }
 s.stepOffset={x:numeric(o.stepOffset===undefined?0:o.stepOffset?.x,'Step 偏移 X',-1e8,1e8),y:numeric(o.stepOffset===undefined?0:o.stepOffset?.y,'Step 偏移 Y',-1e8,1e8)};
 const r=o.render||{};
 s.render={alpha:numeric(r.alpha??.5,'α',.15,1),laneOpacity:numeric(r.laneOpacity??.65,'不透明度',.1,1),showDims:r.showDims!==false,showStep:r.showStep!==false};
 return{s,message:(legacy?'旧版配置已导入：Scribe 以首条内部街道（单 Die 时使用旧 Step 或边缘信息）作为初值。':'配置已导入。')+'所有车道宽度原样保留。'+(streetChecks(s).some(c=>c.mismatch)?'存在总宽差异，请查看 warning。':'')};
}
let state=createDefault();
const $=id=>document.getElementById(id);
let toastTimer;
function notify(text,duration=5500){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,duration);}
function field(label,path,v,min=0,max=1e8,step='any'){return `<label class="field"><span>${label}</span><input type="number" data-path="${path}" value="${v}" min="${min}" max="${max}" step="${step}" required><span class="hint" hidden></span></label>`;}

function updateDerived(){const d=computeDerived(state),actual=layoutMetrics(state),mismatch=streetChecks(state).some(c=>c.mismatch);$('derived').innerHTML=`<div class="results-head"><span>AUTOMATIC RESULTS</span><span>µm</span></div><div class="result"><div class="result-name">Step size · X × Y</div><div class="result-value">${fmt(d.stepX)} × ${fmt(d.stepY)}</div></div><div class="result"><div class="result-name">Shot size · X × Y（由输入参数推导）</div><div class="result-value">${fmt(d.shotX)} × ${fmt(d.shotY)}</div></div><div class="pitch"><span>Die pitch · X × Y</span><b>${fmt(d.dcx)} × ${fmt(d.dcy)}</b></div><div class="pitch"><span>Die / Shot</span><b>${state.cols*state.rows} · ${fmt(d.util)}%</b></div>${mismatch?`<div class="pitch consistency-status"><span>车道实际布局</span><b>${fmt(actual.x)} × ${fmt(actual.y)}</b></div>`:''}<div class="formula">Step = N × (Die + Scribe)<br>Shot = Step + Overlap<br>单侧边缘街道目标 = (Scribe + Overlap) / 2</div>`;updatePositionWarning();$('vSummary').textContent=`X 向街道 · ${state.cols+1} 条`;$('hSummary').textContent=`Y 向街道 · ${state.rows+1} 条`;$('canvasTitle').textContent=state.meta.title||'Reticle / Shot 示意图';$('scaleStatus').textContent=state.render.alpha===1?'真实比例':'街道增强显示';$('shotLegend').innerHTML='<i></i>'+(mismatch?'车道布局边界':'Shot 边界');}

function axisLayout(s,axis){const n=axis==='x'?s.cols:s.rows,key=axis==='x'?'vStreets':'hStreets',alpha=s.render.alpha,pow=w=>w<=0?0:w**alpha;const segments=[],bands=[],dies=[];let pos=0,physical=0;

function validNumericInput(t){const n=t.valueAsNumber;const count=['cols','rows'].includes(t.dataset.path);if(!Number.isFinite(n)||t.value.trim()===''||n<Number(t.min)||n>Number(t.max)||(count&&!Number.isInteger(n))){invalidate(t,count?'请输入 1–30 的整数':'请输入范围内的有效数值');return null;}clearInvalid(t);return n;}
function bindPanel(){
 $('panelLeft').addEventListener('input',e=>{const t=e.target;if(t.dataset.lane==='width'){const n=validNumericInput(t);if(n===null)return;const el=t.closest('.street'),key=el.dataset.key,i=+el.dataset.i,j=+t.closest('.lane').dataset.j;state[key][i].lanes[j].width=n;updateStreetStatus(el,key,i);refresh();return;}const path=t.dataset.path;if(!path)return;if(t.type==='number'){const value=validNumericInput(t);if(value===null)return;setPath(path,value);if(path.startsWith('stepOffset.')){refresh();}else{syncStreets(state);refresh({streets:true});}}else{setPath(path,t.type==='checkbox'?t.checked:t.type==='range'?Number(t.value):t.value);if(path==='render.alpha')$('alphaVal').textContent=t.value;if(path==='render.laneOpacity')$('opacityVal').textContent=t.value;refresh();}});
 $('panelLeft').addEventListener('change',e=>{const t=e.target,stEl=t.closest('.street');if(!stEl)return;const key=stEl.dataset.key,i=+stEl.dataset.i,st=state[key][i];if(t.hasAttribute('data-name')){st.name=t.value;updateInfo();return;}const name=t.dataset.lane;if(!name)return;const j=+t.closest('.lane').dataset.j;if(name==='width')return;st.lanes[j][name]=t.value;draw();updateInfo();});
 $('panelLeft').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='btnStepCenter'){state.stepOffset={x:0,y:0};updateStepPosition();updateInfo();if(autoFit)fitView();return;}if(b.id==='btnSample'){if(!confirm('恢复示例参数？当前修改将被替换。'))return;state=createDefault();renderPanel();refresh();fitView();return;}const action=b.dataset.action;if(!action)return;const el=b.closest('.street'),key=el.dataset.key,i=+el.dataset.i,st=state[key][i],j=+b.closest('.lane')?.dataset.j;
  if(action==='add'&&st.lanes.length<MAX_LANES){st.lanes.push(lane('新车道',targetWidth(state,key==='vStreets'?'x':'y',i)/10,'#cfe3ff'));}
  else if(action==='del'&&st.lanes.length>1){st.lanes.splice(j,1);}
  else if(action==='up'&&j>0)[st.lanes[j-1],st.lanes[j]]=[st.lanes[j],st.lanes[j-1]];
  else if(action==='down'&&j<st.lanes.length-1)[st.lanes[j+1],st.lanes[j]]=[st.lanes[j],st.lanes[j+1]];
  el.outerHTML=renderStreet(st,key,i);refresh();
 });
}
let view={x:0,y:0,w:1000,h:900},fitBox={...view},autoFit=true;
function drawingBounds(){const b=$('drawing').getBBox(),pad=26;return{x:b.x-pad,y:b.y-pad,w:b.width+2*pad,h:b.height+2*pad};}
function applyView(){const svg=$('svg');svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);$('zoomInd').textContent=Math.round(fitBox.w/view.w*100)+'%';}
function fitView(){autoFit=true;view=drawingBounds();fitBox={...view};applyView();}
function pointerWorld(e){const p=new DOMPoint(e.clientX,e.clientY);return p.matrixTransform($('svg').getScreenCTM().inverse());}
function zoomBy(factor,point){autoFit=false;const p=point||{x:view.x+view.w/2,y:view.y+view.h/2},f=clamp(view.w*factor,fitBox.w*.15,fitBox.w*12)/view.w;view={x:p.x+(view.x-p.x)*f,y:p.y+(view.y-p.y)*f,w:view.w*f,h:view.h*f};applyView();}
function bindCanvas(){
 const svg=$('svg');let drag=null;
 svg.addEventListener('wheel',e=>{e.preventDefault();if(drag?.mode==='step')return;zoomBy(e.deltaY<0?.89:1/.89,pointerWorld(e));},{passive:false});
 svg.addEventListener('pointerdown',e=>{if(e.button!==0||drag)return;autoFit=false;const step=!!e.target.closest('[data-step-drag]');drag={id:e.pointerId,mode:step?'step':'pan',point:pointerWorld(e),layout:step?computeLayout(state):null,initial:step?{...state.stepOffset}:null};svg.setPointerCapture(e.pointerId);svg.classList.add(step?'step-dragging':'dragging');if(step)e.preventDefault();});
 svg.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=pointerWorld(e);if(drag.mode==='step'){state.stepOffset=offsetFromDrag(drag.layout,drag.point,p,drag.initial);updateStepPosition();}else{view.x+=drag.point.x-p.x;view.y+=drag.point.y-p.y;applyView();}});
 const stop=e=>{if(!drag||e.pointerId!==drag.id)return;if(drag.mode==='step')updateInfo();drag=null;svg.classList.remove('dragging','step-dragging');};
 svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);svg.addEventListener('lostpointercapture',stop);
 svg.addEventListener('keydown',e=>{if(!e.target.closest('[data-step-drag]')||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home'].includes(e.key))return;e.preventDefault();const n=e.shiftKey?10:1;if(e.key==='Home')state.stepOffset={x:0,y:0};else{const a=['ArrowLeft','ArrowRight'].includes(e.key)?'x':'y',sign=['ArrowRight','ArrowUp'].includes(e.key)?1:-1;state.stepOffset[a]=Number(clamp(state.stepOffset[a]+sign*n,-1e8,1e8).toFixed(4));}updateStepPosition();updateInfo();});
 $('btnZoomIn').onclick=()=>zoomBy(.8);$('btnZoomOut').onclick=()=>zoomBy(1.25);$('btnFit').onclick=fitView;$('btnReset').onclick=fitView;new ResizeObserver(()=>applyView()).observe($('canvasWrap'));
}
function exportsValid(){const invalid=$('panelLeft').querySelector('[aria-invalid="true"]');if(invalid){invalid.focus();notify('请先修正无效输入；画布当前保留上一次有效值。');return false;}return true;}
function exportSVG(transparent=true){const b=drawingBounds(),svg=$('svg').cloneNode(true);svg.setAttribute('viewBox',`${b.x} ${b.y} ${b.w} ${b.h}`);svg.setAttribute('width',b.w);svg.setAttribute('height',b.h);svg.removeAttribute('class');svg.removeAttribute('style');svg.querySelector('#stepControls')?.remove();if(transparent)svg.querySelector('#shotBackground').setAttribute('fill','none');return{svg,b};}
async function makePNG(){const {svg,b}=exportSVG(),scale=Math.min(3,5000/Math.max(b.w,b.h)),canvas=document.createElement('canvas');canvas.width=Math.ceil(b.w*scale);canvas.height=Math.ceil(b.h*scale);const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml;charset=utf-8'}));try{const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(Error('SVG 图像转换失败'));img.src=url;});const ctx=canvas.getContext('2d');if(!ctx)throw Error('无法创建图像画布');ctx.drawImage(img,0,0,canvas.width,canvas.height);return await new Promise((ok,no)=>canvas.toBlob(b=>b?ok(b):no(Error('PNG 编码失败')),'image/png'));}finally{URL.revokeObjectURL(url);}}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);}
async function copyPNG(){if(!exportsValid())return;const b=$('btnCopy');b.disabled=true;b.textContent='正在生成…';const png=makePNG();try{if(!window.isSecureContext||!navigator.clipboard?.write||typeof ClipboardItem==='undefined')throw Error('clipboard unavailable');await navigator.clipboard.write([new ClipboardItem({'image/png':png})]);notify('已复制透明 PNG，可直接粘贴到文档或演示文稿。');}catch(error){try{download(await png,'reticle-transparent.png');notify('浏览器未允许图片复制，已改为下载透明 PNG。',7000);}catch(err){notify('PNG 生成失败：'+err.message);}}finally{b.disabled=false;b.textContent='复制透明 PNG';}}
function printPDF(){if(!exportsValid())return;const {svg}=exportSVG(false),w=window.open('','_blank');if(!w){notify('请允许弹出窗口后重试保存 PDF。');return;}const d=computeDerived(state),rows=[['Die',`${fmt(state.die.x)} × ${fmt(state.die.y)}`],['Array',`${state.cols} × ${state.rows}`],['Scribe',`${fmt(state.scribe.x)} × ${fmt(state.scribe.y)}`],['Overlap',`${fmt(state.overlap.x)} × ${fmt(state.overlap.y)}`],['Step',`${fmt(d.stepX)} × ${fmt(d.stepY)}`],['理论 Shot',`${fmt(d.shotX)} × ${fmt(d.shotY)}`],['实际布局',`${fmt(layoutMetrics(state).x)} × ${fmt(layoutMetrics(state).y)}`],['Step 偏移 X / Y',`${fmt(state.stepOffset.x)} / ${fmt(state.stepOffset.y)}`]];w.document.open();w.document.write(`<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>${esc(state.meta.title)}</title><style>@page{size:A3 landscape;margin:10mm}body{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#223d51;margin:0}.sheet{display:flex;align-items:flex-start;gap:25px}.figure{flex:1;min-width:0}.figure svg{width:100%;height:250mm}aside{width:190px;flex:none;padding-top:35px}h2{font-size:14px}p,td{font-size:10px;line-height:1.7}td{padding:6px 0;border-bottom:1px solid #e4e9ed}td:last-child{text-align:right;padding-left:12px;font-weight:600}.print{margin:10px;border:1px solid #ccc;background:#f5f8fa;border-radius:5px;padding:8px;color:#234} @media print{.print{display:none}}</style></head><body><button class="print" onclick="window.print()">打印 / 保存 PDF</button><div class="sheet"><div class="figure">${svg.outerHTML}</div><aside><h2>参数摘要</h2><p>长度单位 µm · wafer 面</p><table>${rows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('')}</table><p>Step = N × (Die + Scribe)<br>Shot = Step + Overlap</p>${streetChecks(state).some(c=>c.mismatch)?'<p style="color:#ad702b">⚠ 街道总宽与目标不一致，图形按实际车道宽度绘制。</p>':''}<p>${state.render.alpha===1?'真实比例':'街道增强显示 · 非真实比例'}</p></aside></div></body></html>`);w.document.close();const run=()=>{w.focus();w.print();};if(w.document.fonts?.ready)w.document.fonts.ready.then(()=>setTimeout(run,250));else setTimeout(run,400);}
function toggleInfo(open){$('panelRight').hidden=!open;$('btnInfo').classList.toggle('on',open);$('btnInfo').setAttribute('aria-expanded',String(open));}
function bindToolbar(){
 $('btnCopy').onclick=copyPNG;
 $('btnPNG').onclick=async()=>{if(!exportsValid())return;const b=$('btnPNG');b.disabled=true;try{download(await makePNG(),'reticle-transparent.png');notify('透明 PNG 已下载。');}catch(e){notify(e.message);}finally{b.disabled=false;}};
 $('btnPDF').onclick=printPDF;
 $('btnInfo').onclick=()=>toggleInfo($('panelRight').hidden);$('panelRight').addEventListener('click',e=>{if(e.target.id==='closeInfo')toggleInfo(false);});
 $('btnExport').onclick=()=>{if(!exportsValid())return;download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'reticle-config-v3.json');notify('JSON 已导出；Step / Shot 将在导入后重新推导。');};
 $('btnImport').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{if(file.size>2*1024*1024)throw Error('JSON 文件不能超过 2 MB');const {s,message}=normalizeConfig(JSON.parse(await file.text()));state=s;renderPanel();refresh();fitView();notify(message,8500);}catch(error){notify('导入失败：'+error.message,8500);}finally{e.target.value='';}};
 document.addEventListener('keydown',e=>{if(e.key==='Escape')toggleInfo(false);});
}
// Initialization deliberately keeps all user data in this browser tab.
renderPanel();draw();updateInfo();bindPanel();bindCanvas();bindToolbar();fitView();
</script></body></html>

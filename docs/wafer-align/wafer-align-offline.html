<script id="geometry-core">
'use strict';
const Core=(()=>{
 const EPS=1e-8,MAX_DIES=120000;
 const finite=n=>typeof n==='number'&&Number.isFinite(n);
 const mod=(a,n)=>(a%n+n)%n;
 function derive(t){const px=t.dx+t.sx,py=t.dy+t.sy,stepX=t.nx*px,stepY=t.ny*py;return {px,py,stepX,stepY,shotX:stepX+t.ox,shotY:stepY+t.oy,er:t.sx+t.ox-t.el,et:t.sy+t.oy-t.eb};}
 function validate(s){const errors=[];if(!s||s.version!==1||!Array.isArray(s.types)||!Array.isArray(s.layers))return ['配置格式不正确：需要 version=1、types 和 layers。'];if(s.types.length<1||s.types.length>16)errors.push('Wafer 类型数量须为 1–16。');if(s.layers.length<2||s.layers.length>12)errors.push('堆叠层数须为 2–12。');const ids=new Set(),lids=new Set();
  s.types.forEach((t,i)=>{const p=`类型 ${i+1}：`;if(!t||typeof t!=='object'){errors.push(p+'格式不正确。');return;}if(typeof t.id!=='string'||ids.has(t.id))errors.push(p+'ID 缺失或重复。');ids.add(t.id);if(typeof t.name!=='string'||t.name.length>80)errors.push(p+'名称须为 0–80 字符。');if(!/^#[0-9a-f]{6}$/i.test(t.color))errors.push(p+'颜色格式不正确。');for(const k of ['dx','dy','sx','sy','ox','oy','nx','ny','el','eb','dia','edge','gx','gy'])if(!finite(t[k]))errors.push(p+k+' 必须是有限数值。');if(!(t.dx>0&&t.dy>0&&t.sx>0&&t.sy>0))errors.push(p+'Die 与 scribe 尺寸必须大于 0。');if(!(t.ox>=0&&t.ox<t.sx&&t.oy>=0&&t.oy<t.sy))errors.push(p+'要求 0 ≤ overlap < scribe。');if(!Number.isInteger(t.nx)||!Number.isInteger(t.ny)||t.nx<1||t.ny<1||t.nx>128||t.ny>128)errors.push(p+'阵列行列须为 1–128 的整数。');const d=derive(t);if(t.el<0||t.eb<0||d.er<-EPS||d.et<-EPS)errors.push(p+'外切割道宽度不能为负。');if(!['left','right'].includes(t.sideX)||!['bottom','top'].includes(t.sideY))errors.push(p+'Overlap 侧别无效。');if((t.sideX==='left'?t.el:d.er)+EPS<t.ox||(t.sideY==='bottom'?t.eb:d.et)+EPS<t.oy)errors.push(p+'承载 overlap 的外切割道宽度不足，请修改外切割道或切换侧别。');if(!(t.dia>0&&t.dia<=1000&&t.edge>=0&&t.edge<t.dia/2))errors.push(p+'Wafer 直径须在 (0,1000]，edge exclusion 须小于半径。');if(Math.abs(t.gx)>10000||Math.abs(t.gy)>10000)errors.push(p+'Grid Offset 绝对值不得超过 10000 mm。');});
  s.layers.forEach((l,i)=>{const p=`层 ${i+1}：`;if(!l||typeof l!=='object'){errors.push(p+'格式不正确。');return;}if(typeof l.id!=='string'||lids.has(l.id))errors.push(p+'ID 缺失或重复。');lids.add(l.id);if(!ids.has(l.type))errors.push(p+'找不到 wafer 类型。');if(!['up','down'].includes(l.face))errors.push(p+'Face 只能是 up 或 down。');if(![l.tx,l.ty,l.theta,l.opacity].every(finite)||Math.abs(l.tx)>10000||Math.abs(l.ty)>10000||Math.abs(l.theta)>36000||l.opacity<.05||l.opacity>1)errors.push(p+'平移、旋转或透明度无效。');if(typeof l.visible!=='boolean')errors.push(p+'visible 必须为布尔值。');});
  const c=s.check;if(!c||!lids.has(c.ref)||!lids.has(c.target)||c.ref===c.target)errors.push('请选择两个不同的检查层。');if(!c||!finite(c.tol)||c.tol<0||c.tol>10000)errors.push('容差须为 0–10000 μm。');if(c&&!['auto','manual'].includes(c.mode))errors.push('组数模式无效。');if(c&&(!Number.isInteger(c.mx)||!Number.isInteger(c.my)||c.mx<1||c.my<1||c.mx>128||c.my>128))errors.push('小 die 组数须为 1–128 的整数。');return errors;}
 function clean(s){const pick=(o,ks)=>Object.fromEntries(ks.map(k=>[k,o[k]]));return {version:1,types:s.types.map(t=>pick(t,['id','name','color','dx','dy','sx','sy','ox','oy','nx','ny','el','eb','sideX','sideY','dia','edge','gx','gy'])),layers:s.layers.map(l=>pick(l,['id','type','face','theta','tx','ty','visible','opacity'])),check:pick(s.check,['ref','target','tol','mode','mx','my'])};}
 function vec(l,p){const a=l.theta*Math.PI/180,c=Math.cos(a),s=Math.sin(a),x=p.x*(l.face==='down'?-1:1);return {x:c*x-s*p.y,y:s*x+c*p.y};}
 function point(l,p){const v=vec(l,p);return {x:v.x+l.tx,y:v.y+l.ty};}
 function inverse(l,p){const a=l.theta*Math.PI/180,c=Math.cos(a),s=Math.sin(a),x=p.x-l.tx,y=p.y-l.ty;return {x:(c*x+s*y)*(l.face==='down'?-1:1),y:-s*x+c*y};}
 function corners(x,y,w,h){return [{x:x-w/2,y:y-h/2},{x:x+w/2,y:y-h/2},{x:x+w/2,y:y+h/2},{x:x-w/2,y:y+h/2}];}
 function wafer(t,l){const d=derive(t),R=t.dia/2,r=R-t.edge;const minI=Math.ceil((-R-d.shotX/2-t.gx)/d.stepX),maxI=Math.floor((R+d.shotX/2-t.gx)/d.stepX),minJ=Math.ceil((-R-d.shotY/2-t.gy)/d.stepY),maxJ=Math.floor((R+d.shotY/2-t.gy)/d.stepY);const estimate=(maxI-minI+1)*(maxJ-minJ+1)*t.nx*t.ny;if(!finite(estimate)||estimate>MAX_DIES*1.8)throw Error(`${t.name}：预计生成 ${Math.ceil(estimate).toLocaleString()} 个 die 候选，超出本版上限；请增大 die 或缩小 wafer。`);
  const baseX=t.gx-d.shotX/2+t.el+t.dx/2,baseY=t.gy-d.shotY/2+t.eb+t.dy/2,dies=[],shots=[],index=new Map();for(let j=minJ;j<=maxJ;j++)for(let i=minI;i<=maxI;i++){const x=t.gx+i*d.stepX,y=t.gy+j*d.stepY;const nearX=Math.max(Math.abs(x)-d.shotX/2,0),nearY=Math.max(Math.abs(y)-d.shotY/2,0);if(nearX*nearX+nearY*nearY>R*R+EPS)continue;shots.push({i,j,x,y});for(let row=0;row<t.ny;row++)for(let col=0;col<t.nx;col++){const k=i*t.nx+col,m=j*t.ny+row,cx=baseX+k*d.px,cy=baseY+m*d.py;const qx=Math.max(Math.abs(cx)-t.dx/2,0),qy=Math.max(Math.abs(cy)-t.dy/2,0);if(qx*qx+qy*qy>=R*R-EPS)continue;const full=(Math.abs(cx)+t.dx/2)**2+(Math.abs(cy)+t.dy/2)**2<=r*r+EPS;const die={k,m,i,j,col,row,x:cx,y:cy,full};dies.push(die);index.set(k+','+m,die);if(dies.length>MAX_DIES)throw Error(`${t.name} 超出 ${MAX_DIES.toLocaleString()} die/层上限。`);}}
  return {t,l,d,dies,shots,index,baseX,baseY,full:dies.filter(x=>x.full).length};}
 function setup(a,b,c){const u=inverse(a.l,point(b.l,{x:1,y:0})),o=inverse(a.l,point(b.l,{x:0,y:0}));const angle=Math.atan2(u.y-o.y,u.x-o.x)*180/Math.PI;const q=mod(Math.round(angle/90),4),swap=q%2===1,wx=swap?a.t.dy:a.t.dx,hy=swap?a.t.dx:a.t.dy;const mx=c.mode==='manual'?c.mx:Math.max(1,Math.round((wx+b.t.sx)/b.d.px)),my=c.mode==='manual'?c.my:Math.max(1,Math.round((hy+b.t.sy)/b.d.py));const w=mx*b.t.dx+(mx-1)*b.t.sx,h=my*b.t.dy+(my-1)*b.t.sy;return {mx,my,w,h,angle,residual:angle-Math.round(angle/90)*90,swap,nominalX:(swap?h:w)-a.t.dx,nominalY:(swap?w:h)-a.t.dy};}
 function match(a,b,die,g,tol){const center=inverse(b.l,point(a.l,die));const k=Math.round((center.x-b.baseX-(g.mx-1)*b.d.px/2)/b.d.px),m=Math.round((center.y-b.baseY-(g.my-1)*b.d.py/2)/b.d.py);const cx=b.baseX+(k+(g.mx-1)/2)*b.d.px,cy=b.baseY+(m+(g.my-1)/2)*b.d.py;const poly=corners(cx,cy,g.w,g.h).map(p=>point(b.l,p)),actual=poly.map(p=>inverse(a.l,p)),expected=corners(die.x,die.y,a.t.dx,a.t.dy);let best=null;for(const dir of [1,-1])for(let off=0;off<4;off++){const mapped=expected.map((_,i)=>actual[mod(off+dir*i,4)]),score=Math.max(...mapped.map((p,i)=>Math.max(Math.abs(p.x-expected[i].x),Math.abs(p.y-expected[i].y))));if(!best||score<best.score)best={score,mapped};}
  const diff=best.mapped.map((p,i)=>({x:p.x-expected[i].x,y:p.y-expected[i].y}));const worst=(v,w)=>Math.abs(v)>=Math.abs(w)?v:w;const edges={left:worst(diff[0].x,diff[3].x),right:worst(diff[1].x,diff[2].x),bottom:worst(diff[0].y,diff[1].y),top:worst(diff[2].y,diff[3].y)};let missing=0;for(let y=0;y<g.my;y++)for(let x=0;x<g.mx;x++){const p=b.index.get((k+x)+','+(m+y));if(!p||!p.full)missing++;}const ok=best.score<=tol/1000+EPS;return {die,k,m,cx,cy,poly,edges,error:best.score,missing,count:g.mx*g.my,status:!die.full?'partial':missing?'missing':ok?'pass':'fail',center:point(a.l,die)};}
 function analyze(a,b,c){const g=setup(a,b,c);if(g.mx>128||g.my>128||g.mx*g.my>4096)throw Error('推算的小 die 组过大；单组上限为 4096 颗、每轴最多 128 颗。');if(a.full*g.mx*g.my>3000000)throw Error('本次检查超过 300 万个对应关系，请缩小 wafer 或组数。');const records=a.dies.filter(d=>d.full).map(d=>match(a,b,d,g,c.tol));const pass=records.filter(x=>x.status==='pass').length,fail=records.filter(x=>x.status==='fail').length,missing=records.filter(x=>x.status==='missing').length;let max=0;for(const r of records)if(!r.missing)max=Math.max(max,r.error);let shotMax=0,shotCount=0;for(const sh of a.shots){if(Math.hypot(sh.x,sh.y)>a.t.dia/2-a.t.edge)continue;const p=point(a.l,sh),q=inverse(b.l,p),i=Math.round((q.x-b.t.gx)/b.d.stepX),j=Math.round((q.y-b.t.gy)/b.d.stepY);const x=b.t.gx+i*b.d.stepX,y=b.t.gy+j*b.d.stepY;if(Math.hypot(x,y)>b.t.dia/2-b.t.edge)continue;const z=point(b.l,{x,y});shotMax=Math.max(shotMax,Math.hypot(z.x-p.x,z.y-p.y));shotCount++;}let shotReverseMax=0,shotReverseCount=0;for(const sh of b.shots){if(Math.hypot(sh.x,sh.y)>b.t.dia/2-b.t.edge)continue;const p=point(b.l,sh),q=inverse(a.l,p),i=Math.round((q.x-a.t.gx)/a.d.stepX),j=Math.round((q.y-a.t.gy)/a.d.stepY);const x=a.t.gx+i*a.d.stepX,y=a.t.gy+j*a.d.stepY;if(Math.hypot(x,y)>a.t.dia/2-a.t.edge)continue;const z=point(a.l,{x,y});shotReverseMax=Math.max(shotReverseMax,Math.hypot(z.x-p.x,z.y-p.y));shotReverseCount++;}return {g,records,pass,fail,missing,max,shotMax,shotCount,shotReverseMax,shotReverseCount,total:records.length,excluded:a.dies.length-a.full};}
 function sample(kind='aligned'){const types=[{id:'A',name:'A · 大 Die',color:'#087f91',dx:20,dy:20,sx:.1,sy:.1,ox:.02,oy:.02,nx:1,ny:1,el:.06,eb:.06,sideX:'right',sideY:'top',dia:300,edge:3,gx:0,gy:0},{id:'B',name:'B · 小 Die',color:'#b56bce',dx:9.95,dy:9.95,sx:.1,sy:.1,ox:.02,oy:.02,nx:2,ny:2,el:.06,eb:.06,sideX:'right',sideY:'top',dia:300,edge:3,gx:0,gy:0}],layers=[{id:'L1',type:'A',face:'up',theta:0,tx:0,ty:0,visible:true,opacity:.8},{id:'L2',type:'B',face:'down',theta:0,tx:0,ty:0,visible:true,opacity:.8}],check={ref:'L1',target:'L2',tol:1,mode:'auto',mx:2,my:2};if(kind==='shift')layers[1].tx=.05;if(kind==='asym'){types[0].el=.08;types[0].eb=.04;}if(kind==='period'){types[0].sx=.12;types[0].sy=.12;types[0].el=.07;types[0].eb=.07;}if(kind==='three'){types.push({...types[1],id:'C',name:'C · 4×4 阵列',color:'#df8e26',nx:4,ny:4,gx:10.05,gy:10.05});layers.push({...layers[0],id:'L3',type:'C'});check.target='L3';}return {version:1,types,layers,check};}

 <div class="section"><h2>Reticle 几何</h2><div class="grid2">${input('Die_X','dx',t.dx,{min:0})}${input('Die_Y','dy',t.dy,{min:0})}${input('Scribe_X · 内部','sx',t.sx,{min:0})}${input('Scribe_Y · 内部','sy',t.sy,{min:0})}${input('OVERLAP_X','ox',t.ox,{min:0})}${input('OVERLAP_Y','oy',t.oy,{min:0})}${input('列数 X','nx',t.nx,{integer:true,min:1})}${input('行数 Y','ny',t.ny,{integer:true,min:1})}</div><div class="subhead">外部切割道<button class="mini" id="symmetric">对称分配</button></div><div class="grid2">${input('Scribe_EXT_left','el',t.el,{min:0})}${input('Scribe_EXT_bottom','eb',t.eb,{min:0})}<div class="field"><label>右侧 · 计算值</label><input readonly value="${fmt(d.er,6)}"></div><div class="field"><label>上侧 · 计算值</label><input readonly value="${fmt(d.et,6)}"></div><div class="field"><label for="sideX">Overlap X 侧别</label><select id="sideX"><option value="right" ${t.sideX==='right'?'selected':''}>右侧</option><option value="left" ${t.sideX==='left'?'selected':''}>左侧</option></select></div><div class="field"><label for="sideY">Overlap Y 侧别</label><select id="sideY"><option value="top" ${t.sideY==='top'?'selected':''}>上侧</option><option value="bottom" ${t.sideY==='bottom'?'selected':''}>下侧</option></select></div></div><div class="derived"><div class="row"><span>STEP_X / Y</span><output>${fmt(d.stepX,6)} / ${fmt(d.stepY,6)}</output></div><div class="row"><span>SHOT_X / Y</span><output>${fmt(d.shotX,6)} / ${fmt(d.shotY,6)}</output></div><div class="row"><span>Array 中心偏移 X / Y</span><output>${fmt((t.el-d.er)/2,6)} / ${fmt((t.eb-d.et)/2,6)}</output></div></div><p class="hint">STEP = N × (Die + Scribe)<br>SHOT = STEP + Overlap<br>外部切割道之和 = Scribe + Overlap</p></div>

 }else if(panel==='check'){
 const ls=state.layers.map(l=>({id:l.id,name:layerName(l)})),c=state.check;
 h=`<div class="section"><h2>比较对象</h2><div class="field"><label>包络层 · 大 die / 参考层</label><select id="ref">${options(ls,c.ref)}</select></div><div class="field" style="margin-top:10px"><label>比较层 · 小 die</label><select id="target">${options(ls,c.target)}</select></div><button id="swap" class="mini" style="margin-top:9px">交换两层</button><div class="grid2" style="margin-top:14px">${input('对准容差 · μm','tol',c.tol,{kind:'check',min:0})}<div class="field"><label>小 die 组数</label><select id="groupMode"><option value="auto" ${c.mode==='auto'?'selected':''}>自动推算</option><option value="manual" ${c.mode==='manual'?'selected':''}>手动指定</option></select></div>${c.mode==='manual'?input('M · 小 die 本地 X','mx',c.mx,{kind:'check',integer:true,min:1})+input('N · 小 die 本地 Y','my',c.my,{kind:'check',integer:true,min:1}):''}</div><div class="derived"><div class="row"><span>当前组数 M × N</span><output>${analysis?analysis.g.mx+' × '+analysis.g.my:'—'}</output></div></div><p class="hint">自动模式按最近的整数组数推算，仍逐颗校验四边；尺寸不兼容不会被自动修正。M/N 使用小 die 层自身坐标。</p></div>

 }else{
 h=`<div class="section help"><h2>使用与坐标约定</h2><p>① 建立 wafer 类型并输入尺寸。② 在“堆叠层”选择每层类型、正反面和位姿。③ 在“检查设置”选择大、小 die 层。④ 点击大 die，查看四边偏差。</p><h3>几何关系</h3><div class="formula">P = Die + Scribe<br>STEP = N × P<br>SHOT = STEP + Overlap<br>EXT_left + EXT_right<br>= Scribe_X + Overlap_X</div><p>Die 尺寸不含切割道。相邻 shot 重叠一次后，die 间 scribe 始终等于内部 scribe。不对称外部切割道只改变阵列在 shot 内的位置。</p><h3>一对多的必要尺寸关系</h3><div class="formula">D_big = M × D_small<br>　　+ (M−1) × S_small</div><p>四边还需位置一致。整片重复对准另需检查大 die 的重复 pitch；局部对齐并不保证整个 wafer 对齐。</p><h3>镜像与位姿</h3><p>输入均为正面、notch 朝下。Face down 先 x → −x，再逆时针旋转 θ，最后加全局平移。层号从下往上；二维图从顶部观察。</p><h3>检查口径</h3><ul><li>完整 die：四角全部位于半径 R−edge exclusion 内。</li><li>边缘 die：与物理圆片相交但不满足完整条件；灰色显示，不参与大 die 通过率。</li><li>Notch 为方向标记，未参与边缘 die 裁切。</li><li>小 die 组允许在不同大 die 间重用；本工具检查边缘几何，不验证电连接、键合 pad 或唯一配对。</li><li>Shot 指标分别检查 A→B 和 B→A 的最近中心最大距离；与 shot 尺寸、周期分别列出。仅比较中心落在双方有效圆片内的 shot。</li><li>空间图为正投影示意，层间距用于展示，不代表厚度。</li></ul><h3>离线与保存</h3><p>此 HTML 的代码、样式和绘图全部内置，无网络请求。直接双击即可使用。浏览器允许时自动保留最后一次有效配置；请用 JSON 保存可迁移副本。</p><p>支持配置 JSON 导入/导出、当前视图 PNG、当前两层完整大 die 检查 CSV。Reticle 图只展示单个或 3×3 shot 窗口，统计始终按完整 wafer 计算。</p><p>资源上限：12 层、每层 12 万颗 die，单组 4096 颗；超过时明确提示并停止检查，不抽样判定。</p><button id="save2" class="fullwidth">保存当前配置 JSON</button></div>`;

function drawSeamMeasurements(){const m=ref(),p=seamPosition(m);const dimension=(a,b,label,dx,dy)=>{const u=screen(Core.point(m.l,a)),v=screen(Core.point(m.l,b));ctx.strokeStyle='#305464';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(u.x,u.y);ctx.lineTo(v.x,v.y);const len=Math.hypot(v.x-u.x,v.y-u.y),nx=-(v.y-u.y)/(len||1)*4,ny=(v.x-u.x)/(len||1)*4;for(const q of [u,v]){ctx.moveTo(q.x-nx,q.y-ny);ctx.lineTo(q.x+nx,q.y+ny);}ctx.stroke();ctx.font='11px ui-monospace,monospace';const x=(u.x+v.x)/2+dx,y=(u.y+v.y)/2+dy,w=ctx.measureText(label).width;ctx.fillStyle='#ffffffee';ctx.fillRect(x-3,y-12,w+6,17);ctx.fillStyle='#224b5b';ctx.fillText(label,x,y);};dimension({x:p.x-m.t.sx/2,y:p.y+m.t.sy*1.7},{x:p.x+m.t.sx/2,y:p.y+m.t.sy*1.7},'Scribe X '+fmt(m.t.sx*1000,3)+' μm',-40,-9);dimension({x:p.x+m.t.sx*1.7,y:p.y-m.t.sy/2},{x:p.x+m.t.sx*1.7,y:p.y+m.t.sy/2},'Scribe Y '+fmt(m.t.sy*1000,3)+' μm',8,0);}
function zoom(f,x=W/2,y=H/2){const old=camera.scale,next=Math.max(.00001,Math.min(1e7,old*f)),r=next/old;camera.ox=(camera.ox+W/2-x)*r+x-W/2;camera.oy=(camera.oy+H/2-y)*r+y-H/2;camera.scale=next;requestDraw();}
function zoomSelected(){if(!selected||!ref())return;if(view==='stack'){toast('精确查看已切换至 Reticle 视图。');setView('reticle');}const a=ref(),p=Core.point(a.l,selected);camera.scale=Math.min((W-80)/a.t.dx,(H-80)/a.t.dy);camera.ox=-p.x*camera.scale;camera.oy=p.y*camera.scale;requestDraw();}
function setView(v){seamFocus=false;view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('scope').style.display=v==='reticle'?'':'none';$('stackControls').style.display=v==='stack'?'flex':'none';$('showPartial').disabled=v==='reticle';resize();fit();}
function download(name,content,mime){const blob=content instanceof Blob?content:new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function exportJSON(){if(errors.length)return toast('请先修正参数，再保存有效配置。');download('wafer-align-config.json',JSON.stringify(Core.clean(state),null,2),'application/json');toast('配置已导出。');}
function exportCSV(){if(!analysis)return;const a=ref(),b=target(),g=analysis.g;const rows=[['reference_layer','reference_type','target_layer','target_type','tol_um','M','N','relative_axis_deg','shot_i','shot_j','die_col','die_row','grid_k','grid_m','center_global_x_mm','center_global_y_mm','small_start_k','small_start_m','status','missing_small_dies','delta_left_um','delta_right_um','delta_bottom_um','delta_top_um','max_edge_um'],...analysis.records.map(r=>[layerName(a.l),a.t.name,layerName(b.l),b.t.name,state.check.tol,g.mx,g.my,g.angle,r.die.i,r.die.j,r.die.col,r.die.row,r.die.k,r.die.m,r.center.x,r.center.y,r.k,r.m,r.status,r.missing,...['left','right','bottom','top'].map(k=>r.edges[k]*1000),r.error*1000])];const cell=v=>{let s=String(v);if(typeof v==='string'&&/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};download('wafer-align-report.csv','\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('完整大 die 报告已导出；pass / fail / missing 分别表示通过、超差、覆盖缺失。');}
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{panel=b.dataset.panel;renderConfig();});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('scope').onchange=fit;for(const k of ['showDie','showShot','showOverlap','showPartial','showGrid'])$(k).onchange=requestDraw;$('plus').onclick=()=>zoom(1.6);$('minus').onclick=()=>zoom(1/1.6);$('fit').onclick=fit;$('seam').onclick=focusSeam;$('pickCenter').onclick=()=>selectCentral();$('zoomDie').onclick=zoomSelected;$('save').onclick=exportJSON;$('csv').onclick=exportCSV;$('load').onclick=()=>$('file').click();$('undo').onclick=()=>{if(!history.length)return;state=history.pop();if(!getType(activeType))activeType=state.types[0].id;selected=null;rebuild();renderConfig();};
$('demo').onchange=e=>{const kind=e.target.value;if(!kind)return;mutate(()=>{state=Core.sample(kind);activeType=state.types[0].id;selected=null;},{fit:true});e.target.value='';toast('示例已加载；可用“撤销”恢复之前的参数。');};
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2*1024*1024)throw Error('JSON 文件上限为 2 MB。');const s=JSON.parse(await f.text()),errs=Core.validate(s);if(errs.length)throw Error(errs.join(' '));const clean=Core.clean(s);const test=clean.layers.map(l=>Core.wafer(clean.types.find(t=>t.id===l.type),l));Core.analyze(test.find(m=>m.l.id===clean.check.ref),test.find(m=>m.l.id===clean.check.target),clean.check);mutate(()=>{state=clean;activeType=state.types[0].id;selected=null;},{fit:true});toast('配置导入成功。');}catch(err){toast('未导入：'+err.message);}e.target.value='';};
$('png').onclick=()=>{draw();const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height+110*dpr;const c=out.getContext('2d');c.fillStyle='#f9fbfb';c.fillRect(0,0,out.width,out.height);c.drawImage(canvas,0,0);c.scale(dpr,dpr);c.fillStyle='#203c49';c.font='bold 14px system-ui';c.fillText('WAFER / ALIGN · '+({reticle:'Reticle',wafer:'Wafer map',stack:'Stack'}[view]),18,H+25);c.font='11px system-ui';const r=analysis;c.fillText(r?`整片统计：通过 ${r.pass} / ${r.total}；超差 ${r.fail}；缺失 ${r.missing}；容差 ${state.check.tol} μm`:'参数无效，暂无检查结果',18,H+47);let x=18;for(const m of models.filter(m=>m.l.visible)){c.fillStyle=m.t.color;c.fillRect(x,H+63,9,9);c.fillStyle='#203c49';const text=`L${state.layers.indexOf(m.l)+1} ${m.t.name} · ${m.l.face}`;c.fillText(text,x+15,H+72);x+=c.measureText(text).width+35;if(x>W-150)break;}c.fillStyle='#657582';c.font='10px system-ui';c.fillText('选中大 die：金色；小 die 组外包络：粉色虚线。Notch 为方向示意。',18,H+96);out.toBlob(blob=>{if(blob)download('wafer-align-view.png',blob);else toast('PNG 导出失败。');},'image/png');};
for(const k of ['gap','yaw','elevation'])$(k).oninput=()=>{$('gapValue').textContent=$('gap').value;requestDraw();};
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0013),e.clientX-r.left,e.clientY-r.top);},{passive:false});
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;canvas.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY,ox:camera.ox,oy:camera.oy,moved:false,yaw:Number($('yaw').value),el:Number($('elevation').value),rotate:view==='stack'&&!e.shiftKey};});
canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(view!=='stack'){const p=screenWorld(x,y);$('coords').textContent='X '+fmt(p.x,5)+' / Y '+fmt(p.y,5)+' mm';}else $('coords').textContent='空间示意 · 正投影';if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>3)drag.moved=true;if(drag.rotate){$('yaw').value=Math.max(-180,Math.min(180,drag.yaw+dx*.35));$('elevation').value=Math.max(10,Math.min(85,drag.el+dy*.25));}else{camera.ox=drag.ox+dx;camera.oy=drag.oy+dy;}requestDraw();});
canvas.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const moved=drag.moved;drag=null;if(moved||view==='stack'||!ref()||!ref().l.visible)return;const r=canvas.getBoundingClientRect(),p=Core.inverse(ref().l,screenWorld(e.clientX-r.left,e.clientY-r.top)),m=ref(),k=Math.round((p.x-m.baseX)/m.d.px),n=Math.round((p.y-m.baseY)/m.d.py),die=m.index.get(k+','+n);if(die&&Math.abs(die.x-p.x)<=m.t.dx/2&&Math.abs(die.y-p.y)<=m.t.dy/2){selected=die;renderDetail();requestDraw();}});canvas.addEventListener('pointercancel',()=>drag=null);
window.addEventListener('keydown',e=>{if(e.key==='Escape'){drag=null;}if(e.key==='0'&&!['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))fit();});
new ResizeObserver(resize).observe($('stage'));renderConfig();rebuild();resize();fit();
</script>
